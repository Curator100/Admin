[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ===========================================================================
# SAME-ORIGIN API PROXY — makes the Tuition71 panel work on
# admin71.netlify.app, which is NOT on the backend's CORS allow-list.
#
# The backend moved on 2026-11-12: the old Railway host now answers 404
# "Application not found" and the Render mirror answers 503 "Service
# suspended". netlify/functions/t71.js now targets the live host
# https://api.tuitionsebaforum.com (override with the T71_UPSTREAM env var).
#
# Only these three paths are rewritten. Nothing else under /api/ on this site
# is touched (e.g. debug.html's own /api/debug call is left exactly as it was).
# ===========================================================================
[[redirects]]
  from   = "/api/tuition/*"
  to     = "/.netlify/functions/t71?__p=tuition/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/tuitionApply/*"
  to     = "/.netlify/functions/t71?__p=tuitionApply/:splat"
  status = 200
  force  = true

# Diagnostics: open https://admin71.netlify.app/api/t71-health in a browser.
# It probes every candidate upstream and tells you which one is alive, so a
# future backend move takes one lookup instead of a code hunt.
[[redirects]]
  from   = "/api/t71-health"
  to     = "/.netlify/functions/t71?__health=1"
  status = 200
  force  = true

[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

# The service worker must never be served from cache, or a bad deploy keeps
# replaying its old fetch/caching rules for days.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

# ===========================================================================
# UNCHANGED FROM THE EXISTING REPO FILE — keep these exactly as they are.
# ===========================================================================
# Sends any queued notifications (SOS, Money, unassigned-tuition reminders,
# test pings) as Web Push messages to every registered admin device.
# Runs every minute so a real SOS/Money event reaches the admin within
# ~60 seconds of happening, not just whenever the 5-hour sweep runs.
[functions."send-web-push"]
  schedule = "* * * * *"

# Checks every unassigned tuition and enqueues a "still unassigned"
# notification for any that have gone 5+ hours without an update, then
# again every 5 hours after that for as long as it stays unassigned.
# Runs every 10 minutes -- frequent enough to stay close to "exactly 5h",
# far cheaper than every minute.
[functions."sweep-unassigned"]
  schedule = "*/10 * * * *"

# Repo root is the publish dir, so ignore these when Netlify decides
# whether a push touched deployable content vs. just docs/tooling.
[build.processing]
  skip_processing = false
